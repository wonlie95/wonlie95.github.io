# Hexo site configuration
title: "冰霜の世界"
subtitle: ICE
description: Seeing the world with my own eyes and for a minute I was embarrassed by my short insight.
keywords: ""
author: When_Lie
language: zh-CN
timezone: Asia/Hong_Kong

url: https://wonlie95.github.io
root: /
permalink: ':title/'
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# Required ShokaX Markdown setup. HTML stays enabled for the retained About player.
markdown:
  render:
    html: true
    xhtmlOut: true
    breaks: true
    linkify: true
    typographer: false
    quotes: "“”‘’"
  plugins:
    - plugin:
        name: markdown-it-toc-and-anchor
        enable: true
        options:
          tocClassName: toc
          anchorClassName: anchor
    - plugin:
        name: markdown-it-multimd-table
        enable: true
        options:
          multiline: true
          rowspan: true
          headerless: true

syntax_highlighter: false
highlight:
  enable: false
prismjs:
  enable: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  enabled: true
  per_page: 0
  yearly: false
  monthly: false
  daily: false
per_page: 10
pagination_dir: page

default_category: 未分类
theme: shokax
deploy:
  type: ''

# Project-level overrides for hexo-theme-shokax.
alternate: 冰霜の世界
image_server: 
# Use one predictable, full-width cover on the homepage.  This is the
# classic ShokaX hero layout rather than a rotating image feed.
homeConfig:
  gradient: false
  fixedCover: ""
loader:
  start: false
  switch: false
# Aether is ShokaX's Markdown renderer.  Allow the preserved About page's
# player markup to render instead of being displayed as literal text.
aether:
  markdownIt:
    html: true
    xhtmlOut: true
    breaks: true
    linkify: true
    typographer: false
    quotes: "“”‘’"
modules:
  player: true
  # The click-firework overlay is a known source of repaint flicker on long
  # archive/tag pages in the classic theme. The snow effect remains enabled.
  fireworks: false
  visibilityListener: true
  tabs: true
  quiz: true
menu:
  home: / || home
  about: /about/ || user
  archives: /archives/ || list-alt
  tags: /tags/ || tags
  friends: /friends/ || heart
social:
  github: https://github.com/wonlie95 || github || "#191717"
sidebar:
  position: left
  avatar: avatar.jpg
widgets:
  random_posts: false
  recent_comments: false
footer:
  since: 2023
  count: false
  powered: true
pagefind:
  enable: false
waline:
  enable: true # 是否启用
  serverURL: "https://waline-ice-world-lknof0h0v-wonlie95s-projects.vercel.app" # waline 服务端地址
  lang: "zh-CN" # 评论界面语言
  locale: {} # 本地化替换，详见 waline 文档
  emoji: # 表情包，默认为 waline 官方配置
    - https://unpkg.com/@waline/emojis@1.0.1/weibo
    - https://unpkg.com/@waline/emojis@1.0.1/alus
    - https://unpkg.com/@waline/emojis@1.0.1/bilibili
    - https://unpkg.com/@waline/emojis@1.0.1/qq
    - https://unpkg.com/@waline/emojis@1.0.1/tieba
    - https://unpkg.com/@waline/emojis@1.0.1/tw-emoji
  meta: # 评论可以填写的项目
    - nick
    - link
  requiredMeta: # 评论必须填写的项目

  wordLimit: 0 # 评论字数上限 (不建议为 0)
  pageSize: 10 # 每页显示评论条数
  pageview: true # 页面浏览量显示

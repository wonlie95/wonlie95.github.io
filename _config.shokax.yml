# Project-level overrides for hexo-theme-shokax.
alternate: 冰霜の世界
image_server: 
# Use one predictable, full-width cover on the homepage.  This is the
# classic ShokaX hero layout rather than a rotating image feed.
homeConfig:
  gradient: false
  # One shared banner for the homepage and every article page.
  fixedCover: "https://clan.akamai.steamstatic.com/images//25278042/f446843fd9328318463318c4ec624a9d9ba0f9ca.png"
loader:
  start: false
  switch: false
# Aether is ShokaX's Markdown renderer.  Allow the preserved About page's
# player markup to render instead of being displayed as literal text.
aether:
  markdownIt:
    html: true
    xhtmlOut: true
    breaks: true
    linkify: true
    typographer: false
    quotes: "“”‘’"
modules:
  player: true
  # The click-firework overlay is a known source of repaint flicker on long
  # archive/tag pages in the classic theme. The snow effect remains enabled.
  fireworks: false
  visibilityListener: true
  tabs: true
  quiz: true

# ShokaX original Nyx Player playlist. The Meting-compatible song URL lets
# Nyx Player obtain the audio, cover and synchronized LRC automatically.
audio:
  - title: "キミの記憶"
    list:
      - "https://music.163.com/playlist?id=12584824470"
menu:
  home: / || home
  archives: /archives/ || list-alt
  tags: /tags/ || tags
  about: /about/ || user
  friends: /friends/ || heart
social:
  github: https://github.com/wonlie95 || github || "#191717"
sidebar:
  position: left
  avatar: avatar.jpg
widgets:
  random_posts: false
  recent_comments: false
footer:
  since: 2023
  count: false
  powered: true
pagefind:
  enable: false
waline:
  enable: true # 是否启用
  serverURL: "https://waline-ice-world.vercel.app" # Waline production service address
  lang: "zh-CN" # 评论界面语言
  locale: {} # 本地化替换，详见 waline 文档
  # Do not block the whole comment component on six external unpkg emoji packs.
  # A locally hosted pack can be added later without reintroducing this delay.
  emoji: false
  meta: # 评论可以填写的项目
    - nick
  requiredMeta: # 评论必须填写的项目
    - nick
    - mail
  wordLimit: 999 # 评论字数上限 (不建议为 0)
  pageSize: 10 # 每页显示评论条数
  pageview: false # 关闭页面浏览量请求，避免滚动到底部时触发网络阻塞

name: Sync Notion articles

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node ./node_modules/hexo-theme-shokax/toolbox/hoistdep.mjs
      - name: Synchronize articles
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN is not configured; skipping synchronization."
            exit 0
          fi
          node tools/sync-notion.mjs
      - name: Commit synchronized articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source/_posts/notion source/about source/images/notion 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Sync Notion articles"
            git push
            gh workflow run deploy-pages.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
